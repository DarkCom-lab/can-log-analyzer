<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAN Analyzer — Vehicle Scene</title>
  <style>
    :root{color-scheme:dark;--bg:#14232e;--line:#52667470;--text:#e7eef2;--muted:#9aabb5}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:13px "Segoe UI",Arial,sans-serif;color:var(--text)}
    #app,#stage{position:relative;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#273b49 0%,#172733 46%,#0d1720 100%)}
    #canvas{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;outline:none}
    .overlay{position:absolute;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
    .top{top:10px}.bottom{bottom:10px}
    .pill{border:1px solid var(--line);background:#0b1721bd;border-radius:5px;padding:6px 8px;color:#b8c7cf;font:9px Consolas,monospace;letter-spacing:.07em;white-space:nowrap}
    .pill i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#8fc9ae;margin-right:6px}
    .hint{font:9px Consolas,monospace;color:var(--muted);letter-spacing:.06em;text-shadow:0 1px 3px #09131b}
    .camera{position:absolute;top:43px;left:12px;display:flex;gap:4px}
    .camera button{border:1px solid var(--line);background:#0c1923d9;color:#aebdc5;border-radius:4px;padding:6px 7px;font:9px Consolas,monospace;cursor:pointer}
    .camera button.active,.camera button:hover{color:#e8f0f3;border-color:#a9c4d1;background:#2b414e}
    .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1821ef;color:#b8c7cf;font:10px Consolas,monospace;letter-spacing:.1em}
    .loading.hidden{display:none}.spinner{width:16px;height:16px;border:2px solid #49616f;border-top-color:#c7d9e1;border-radius:50%;animation:spin .8s linear infinite;margin-right:9px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div id="app">
  <section id="stage">
    <div id="canvas"></div>
    <div class="overlay top">
      <div class="pill"><i></i>CAN VEHICLE SCENE</div>
      <div class="pill" id="sync-pill">WAITING FOR GLB</div>
    </div>
    <div class="camera" aria-label="Camera presets">
      <button data-camera="three-quarter" class="active">3/4</button>
      <button data-camera="side">SIDE</button>
      <button data-camera="front">FRONT</button>
      <button data-camera="rear">REAR</button>
    </div>
    <div class="overlay bottom">
      <div class="hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
      <div class="hint">CAN TRACE CONTROLLED</div>
    </div>
    <div class="loading" id="loading"><span class="spinner"></span><span id="loading-text">WAITING FOR GLB MODEL</span></div>
  </section>
</div>
<script src="./viewer.bundle.js"></script>
</body>
</html>
